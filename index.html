<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>M2 UTM Builder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <h1 style="font-size: 24px; font-weight: 800; color: #0f172a; margin-bottom: 8px; text-align: center;">UTM Конструктор</h1>
        <p style="text-align: center; color: #64748b; font-size: 14px; margin-bottom: 32px;">Генерация ссылок по стандартам M2</p>
        
        <div id="status-message" class="status-bar" style="background: #eff6ff; color: #1e40af;">Инициализация системы...</div>

        <div class="mb-6">
            <label class="label-text">Ваш e-mail *</label>
            <input type="email" id="user_email" placeholder="name@m2.ru" class="input-field">
            <button type="button" id="unlock-btn" onclick="unlock()" class="btn-copy">Войти</button>
        </div>

        <div class="section-divider"></div>

        <fieldset id="app-fields" disabled>

        <div class="mb-6">
            <label class="label-text">Базовый URL *</label>
            <input type="text" id="base_url" value="https://m2.ru" placeholder="https://m2.ru/..." class="input-field">
        </div>

        <div class="flow-box">
            <h3 class="box-title">Направление трафика</h3>
            <div id="direction-field"></div>
            <div id="option-field"></div>
            <div id="flow-utm-fields"></div>
        </div>

        <div class="campaign-box">
            <h3 class="box-title">utm_campaign</h3>
            <div class="group-title group-title-required">Обязательные сущности</div>
            <div id="campaign-required-fields"></div>

            <details class="toggle" id="campaign-optional">
                <summary>Необязательные сущности <span class="toggle-count" id="campaign-optional-count"></span></summary>
                <div id="campaign-optional-fields" class="toggle-body"></div>
            </details>
        </div>

        <details class="toggle toggle-standalone" id="extra-utm">
            <summary>Дополнительные UTM-метки <span class="toggle-hint">utm_content, utm_term</span> <span class="toggle-count" id="extra-utm-count"></span></summary>
            <div id="extra-utm-fields" class="toggle-body"></div>
        </details>

        <button onclick="sendData()" class="btn-primary mt-10 shadow-lg">СГЕНЕРИРОВАТЬ ССЫЛКУ</button>

        <div id="form-message" class="status-bar" style="display: none; margin-top: 16px; margin-bottom: 0;"></div>

        <div id="result-box" style="display: none;" class="mt-10 border-t-2 pt-8">
            <div class="mb-8">
                <label class="label-text" style="color: #0f172a;">Готовая ссылка</label>
                <textarea id="final_url" readonly class="input-field" style="height: 100px; background: #f1f5f9; font-family: monospace; font-size: 13px;"></textarea>
                <button onclick="copyToClipboard('final_url', this)" class="btn-copy">Копировать URL</button>
            </div>

            <div>
                <label class="label-text" style="color: #0f172a;">Campaign для кабинета</label>
                <input type="text" id="campaign_debug" readonly class="input-field" style="background: #f1f5f9; font-family: monospace; font-size: 13px;">
                <button onclick="copyToClipboard('campaign_debug', this)" class="btn-copy">Копировать Campaign</button>
            </div>
        </div>
        </fieldset>
    </div>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
